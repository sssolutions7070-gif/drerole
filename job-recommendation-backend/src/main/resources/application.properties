# Local secrets (DB_PASSWORD, PROCTORING_API_KEY, ...) live in an untracked secrets.properties next to the backend;
# real environment variables override it. See secrets.properties.example.
spring.config.import=optional:file:./secrets.properties

proctoring.api-key=${PROCTORING_API_KEY:}

# Base64-encoded 32-byte (AES-256) key used only to encrypt/decrypt stored two-factor-auth
# secrets. Generate one with: openssl rand -base64 32
app.two-factor-key=${TWO_FACTOR_KEY:}

# "Sign in with Google" / "Sign in with LinkedIn" - both optional; each button only appears once
# its own client id/secret are set. This server's own public base URL (not the frontend's) is
# needed to build the exact redirect_uri registered with each provider.
app.backend-base-url=${BACKEND_BASE_URL:http://localhost:8081}
app.oauth.google-client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.oauth.google-client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
app.oauth.linkedin-client-id=${LINKEDIN_OAUTH_CLIENT_ID:}
app.oauth.linkedin-client-secret=${LINKEDIN_OAUTH_CLIENT_SECRET:}

# Video interviews (WebRTC). Google's public STUN servers work out of the box for most
# connections; a TURN server is only needed as a relay of last resort for peers behind strict
# NATs/firewalls, and is optional - leave TURN_URL unset to skip it.
app.webrtc.stun-urls=${WEBRTC_STUN_URLS:stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
app.webrtc.turn-url=${WEBRTC_TURN_URL:}
app.webrtc.turn-username=${WEBRTC_TURN_USERNAME:}
app.webrtc.turn-credential=${WEBRTC_TURN_CREDENTIAL:}

# Recruiter subscriptions (Stripe). Optional - every recruiter is on the FREE tier and the
# "Upgrade" button just reports "not configured" until a secret key and a real Price ID are set.
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.price-id-pro=${STRIPE_PRICE_ID_PRO:}
# How many simultaneously active job postings a FREE-tier recruiter may have open at once.
app.subscription.free-tier-job-limit=${FREE_TIER_JOB_LIMIT:3}

# ============================================
# EMAIL - optional. Leave SMTP_HOST unset for local dev: outgoing mail is
# logged instead of sent. Set these to real values to send real email.
# ============================================
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@dreamrole.local}

# Base URL the frontend is served from; used to build links inside emails (e.g. password reset)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ============================================
# DATABASE CONFIGURATION
# ============================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3336/JobEra09}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================
# SERVER CONFIGURATION - EXTENDED TIMEOUTS
# ============================================

server.port=8081
server.servlet.context-path=/
server.tomcat.connection-timeout=600000
server.tomcat.keep-alive-timeout=60000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=1000

# ============================================
# FILE UPLOAD CONFIGURATION - UNLIMITED
# ============================================

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=1024MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.resolve-lazily=true

# ============================================
# SPRING SECURITY (COMPLETELY DISABLE)
# ============================================

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ============================================
# LOGGING CONFIGURATION
# ============================================

logging.level.com.jobera=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.transaction=WARN

# ============================================
# DATABASE CONNECTION POOL - MAXIMIZED
# ============================================

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================
# TRANSACTION MANAGEMENT
# ============================================

spring.transaction.default-timeout=3600
spring.transaction.rollback-on-commit-failure=false

# ============================================
# ASYNC PROCESSING
# ============================================

spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=1000
spring.task.execution.thread-name-prefix=resume-batch-

# ============================================
# TOMCAT SPECIFIC - UNLIMITED
# ============================================

server.tomcat.max-http-form-post-size=1024MB
server.tomcat.max-swallow-size=1024MB
# Comma-separated origin patterns allowed to call the API from a browser (set to your real frontend URL in production)
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
